<!DOCTYPE html>
<html lang="en">
<head>
  <title>Insta4288</title>
</head>
<body>

  <a href="/">Insta4288</a>
  <a href="/explore/">explore</a>
  <a href="/users/{{ logname }}/">{{ logname }}</a>

  <h1>Followers</h1>

  {% for follower in followers %}
    <div>
      <a href="/users/{{ follower.username }}/">
        <img src="/uploads/{{ follower.filename }}"
             alt="{{ follower.username }}">
      </a>

      <a href="/users/{{ follower.username }}/">
        {{ follower.username }}
      </a>

      {% if follower.username != logname %}
        {% if follower.logname_follows_username %}
          <p>following</p>

          <form action="/following/?target=/users/{{ username }}/followers/"
                method="post" enctype="multipart/form-data">
            <input type="submit" name="unfollow" value="unfollow">
            <input type="hidden" name="username"
                   value="{{ follower.username }}">
            <input type="hidden" name="operation" value="unfollow">
          </form>
        {% else %}
          <p>not following</p>

          <form action="/following/?target=/users/{{ username }}/followers/"
                method="post" enctype="multipart/form-data">
            <input type="submit" name="follow" value="follow">
            <input type="hidden" name="username"
                   value="{{ follower.username }}">
            <input type="hidden" name="operation" value="follow">
          </form>
        {% endif %}
      {% endif %}
    </div>
  {% endfor %}

</body>
</html>
