<!DOCTYPE html>
<html lang="en">
<head>
  <title>Insta4288</title>
</head>
<body>

  <a href="/">Insta4288</a>
  <a href="/explore/">explore</a>
  <a href="/users/{{ logname }}/">{{ logname }}</a>

  <h1>Following</h1>

  {% for followed_user in following %}
    <div>
      <a href="/users/{{ followed_user.username }}/">
        <img src="/uploads/{{ followed_user.filename }}"
             alt="{{ followed_user.username }}">
      </a>

      <a href="/users/{{ followed_user.username }}/">
        {{ followed_user.username }}
      </a>

      {% if followed_user.username != logname %}
        {% if followed_user.logname_follows_username %}
          <p>following</p>

          <form action="/following/?target=/users/{{ username }}/following/"
                method="post" enctype="multipart/form-data">
            <input type="submit" name="unfollow" value="unfollow">
            <input type="hidden" name="username"
                   value="{{ followed_user.username }}">
            <input type="hidden" name="operation" value="unfollow">
          </form>
        {% else %}
          <p>not following</p>

          <form action="/following/?target=/users/{{ username }}/following/"
                method="post" enctype="multipart/form-data">
            <input type="submit" name="follow" value="follow">
            <input type="hidden" name="username"
                   value="{{ followed_user.username }}">
            <input type="hidden" name="operation" value="follow">
          </form>
        {% endif %}
      {% endif %}
    </div>
  {% endfor %}

</body>
</html>
